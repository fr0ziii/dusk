name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify on Node.js 24
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Set up lockfile-compatible npm
        run: npm install --global npm@10.9.4
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck and test
        run: npm run check
      - name: Build standalone executable
        run: npm run build
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Smoke-test CLI
        run: |
          ./dusk --help
          ./dusk . --snapshot > /dev/null
